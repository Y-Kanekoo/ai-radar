version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    # 通常更新のminor/patchだけをまとめる。security updatesは変更しない。
    groups:
      minor-and-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
    labels:
      - "dependencies"
  - package-ecosystem: "github-actions"
    directory: "/"
    open-pull-requests-limit: 2
    # 通常更新のminor/patchだけをまとめる。security updatesは変更しない。
    groups:
      minor-and-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "ci"
