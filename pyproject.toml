[project]
name = "ai-radar"
version = "0.1.0"
description = "AI/LLM領域の最新情報を集約するMCPサーバー兼RSSアグリゲーター（公式リリース・論文・ニュースレター・ベンチマーク・GitHub Trending対応予定）"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Y-Kanekoo" }]
keywords = ["ai", "llm", "anthropic", "openai", "rss", "mcp", "aggregator", "claude", "arxiv", "huggingface"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Natural Language :: Japanese",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content :: News/Diary",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Documentation",
    "Typing :: Typed",
]
# Phase ごとにdependenciesを段階的に追加していく:
#   Phase 1: feedparser, httpx, pyyaml ← 追加済み
#   Phase 3: feedgen ← 追加済み
#   Phase 5: mcp, platformdirs ← 追加済み
#   Phase 8: anthropic（optional-dependencies の `ai` extra に分離）
dependencies = [
    "feedparser>=6.0.11",
    "feedgen>=1.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "mcp>=1.27",
    "platformdirs>=4.0",
    # Phase 0.5: RSS 無しソース向け HTML スクレイピング
    "beautifulsoup4>=4.12",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
ai = [
    "anthropic>=0.40",
]

[project.scripts]
ai-radar = "ai_radar:main"

[project.urls]
Homepage = "https://github.com/Y-Kanekoo/ai-radar"
Repository = "https://github.com/Y-Kanekoo/ai-radar"
Issues = "https://github.com/Y-Kanekoo/ai-radar/issues"
Changelog = "https://github.com/Y-Kanekoo/ai-radar/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_radar"]
# PEP 561: 型ヒント付きパッケージである旨を示すマーカファイル
include = ["src/ai_radar/py.typed"]

[tool.hatch.build.targets.sdist]
# sdist には config/ も含めて `uvx ai-radar` 単体で動くようにする
include = [
    "src/ai_radar/**",
    "config/sources.yaml",
    "config/tag_rules.yaml",
    "config/blocked.yaml",
    "LICENSE",
    "NOTICE",
    "README.md",
    "README.ja.md",
    "CHANGELOG.md",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
]
markers = [
    "integration: integrationテスト（実フィードへの通信を伴う）",
]
filterwarnings = [
    # feedparser内部のCharacterEncodingOverride等を抑制
    "ignore::DeprecationWarning:feedparser.*",
]

[tool.coverage.run]
source = ["src/ai_radar"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
