name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify existing uv tool cache before setup
        env:
          UV_INSTALLER_TOOL_CACHE: ${{ runner.tool_cache }}
        run: python3 scripts/verify_uv_tool_cache.py --tool-cache "$UV_INSTALLER_TOOL_CACHE" --allow-missing

      - name: Install uv
        id: uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          activate-environment: false
          checksum: "23bf5552d220e0842b65c862097b2ebaeba0064b74eda5e565e77fd25969d8c8"
          python-version: "${{ matrix.python-version }}"
          prune-cache: false
          enable-cache: true
          cache-suffix: "installer-v10-${{ matrix.python-version }}"
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Verify installed uv tool cache before execution
        env:
          UV_INSTALLER_TOOL_CACHE: ${{ runner.tool_cache }}
          SELECTED_UV: ${{ steps.uv.outputs.uv-path }}
          SELECTED_UVX: ${{ steps.uv.outputs.uvx-path }}
        run: >-
          python3 scripts/verify_uv_tool_cache.py --tool-cache "$UV_INSTALLER_TOOL_CACHE"
          --check-selected --selected-uv "$SELECTED_UV" --selected-uvx "$SELECTED_UVX"

      - name: Reject tampered warm tool cache fixtures
        env:
          UV_INSTALLER_TOOL_CACHE: ${{ runner.tool_cache }}
        run: python3 tests/installer/check_warm_cache.py --tool-cache "$UV_INSTALLER_TOOL_CACHE"

      - name: Record dependency cache result
        env:
          CACHE_HIT: ${{ steps.uv.outputs.cache-hit }}
          CACHE_KEY: ${{ steps.uv.outputs.cache-key }}
        run: |
          echo "cache-hit=$CACHE_HIT"
          echo "cache-key=$CACHE_KEY"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Pin Python for this run
        run: echo "${{ matrix.python-version }}" > .python-version

      - name: Sync dependencies
        run: uv sync --locked --all-extras --dev

      - name: Record tool versions
        run: |
          uv --version
          uv run --locked python --version

      - name: Lint (ruff check)
        run: uv run --locked ruff check .

      - name: Format check (ruff format --check)
        run: uv run --locked ruff format --check .

      - name: Test (pytest)
        run: uv run --locked pytest -v --cov=ai_radar --cov-report=term-missing

      - name: Coverage threshold (>=80%)
        run: uv run --locked coverage report --fail-under=80

  cache-restore:
    name: Verify dependency cache restore (${{ matrix.python-version }})
    needs: lint-and-test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify existing uv tool cache before setup
        env:
          UV_INSTALLER_TOOL_CACHE: ${{ runner.tool_cache }}
        run: python3 scripts/verify_uv_tool_cache.py --tool-cache "$UV_INSTALLER_TOOL_CACHE" --allow-missing

      - name: Install uv and restore saved cache
        id: uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          activate-environment: false
          checksum: "23bf5552d220e0842b65c862097b2ebaeba0064b74eda5e565e77fd25969d8c8"
          python-version: "${{ matrix.python-version }}"
          enable-cache: true
          save-cache: false
          prune-cache: false
          cache-suffix: "installer-v10-${{ matrix.python-version }}"
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Verify installed uv tool cache before execution
        env:
          UV_INSTALLER_TOOL_CACHE: ${{ runner.tool_cache }}
          SELECTED_UV: ${{ steps.uv.outputs.uv-path }}
          SELECTED_UVX: ${{ steps.uv.outputs.uvx-path }}
        run: >-
          python3 scripts/verify_uv_tool_cache.py --tool-cache "$UV_INSTALLER_TOOL_CACHE"
          --check-selected --selected-uv "$SELECTED_UV" --selected-uvx "$SELECTED_UVX"

      - name: Require restored dependency cache
        env:
          CACHE_HIT: ${{ steps.uv.outputs.cache-hit }}
          CACHE_KEY: ${{ steps.uv.outputs.cache-key }}
        run: |
          echo "cache-hit=$CACHE_HIT"
          echo "cache-key=$CACHE_KEY"
          test "$CACHE_HIT" = "true"
          test ! -d .venv

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install locked dependencies from restored cache
        run: uv sync --locked --offline --all-extras --dev
