# ai-radar ソースリスト（Phase 0、11本、RSS直取りのみ）
#
# スキーマ:
#   slug:       一意ID (snake_case 推奨、DB の sources.slug に保存)
#   name:       表示名
#   feed_url:   RSS / Atom / JSON Feed URL
#   site_url:   サイトトップ
#   language:   ja | en
#   category:   release | paper | newsletter | tool | jp
#               (qa-radar 由来の tool|blog|community|paper|note は廃止)
#   tier:       1 (公式) | 2 (査読) | 3 (キュレーション) | 4 (個人) | 5 (SNS)
#               Phase 2 でスコアリング式 (source_tier × time_decay × user_interest) に使用
#   enabled:    クローラーが取り込むか
#   fetch_policy:
#     min_interval_seconds:   再取得の最小間隔（DDoS抑止）
#     max_items_per_fetch:    1回の取得で読む上限
#   license_note:             利用規約上の集約可否についてのメモ
#
# 全URLは 2026-05-13 時点で WebFetch で実物確認済み（200応答 + 直近3ヶ月の更新確認）.
# スクレイピングが必要なソース (Anthropic, HF Papers, Cursor, Sakana, ELYZA, AI2, Kimi,
# Luma, BFL) は Phase 0.5 (scraper レイヤー実装後) で追加.
# OpenAI は 403 ロックアウトのため Phase 1 で Wayback Machine 経由実装を予定.

version: 1

sources:

  # ============================================================
  # Tier 1 公式リリース (3) — 公式RSS提供
  # ============================================================

  - slug: huggingface-blog
    name: Hugging Face Blog
    feed_url: https://huggingface.co/blog/feed.xml
    site_url: https://huggingface.co/blog
    language: en
    category: release
    tier: 1
    enabled: true
    fetch_policy: { min_interval_seconds: 21600, max_items_per_fetch: 30 }
    license_note: 公開RSS、出所明示+リンクバックで集約可

  - slug: google-research-blog
    name: Google Research Blog
    feed_url: https://research.google/blog/rss/
    site_url: https://research.google/blog/
    language: en
    category: release
    tier: 1
    enabled: true
    fetch_policy: { min_interval_seconds: 21600, max_items_per_fetch: 30 }
    license_note: 公開RSS、出所明示+リンクバックで集約可

  - slug: microsoft-ai-news
    name: Microsoft AI News (The Official Microsoft Blog)
    feed_url: https://news.microsoft.com/source/feed/
    site_url: https://news.microsoft.com/source/
    language: en
    category: release
    tier: 1
    enabled: true
    fetch_policy: { min_interval_seconds: 43200, max_items_per_fetch: 25 }
    license_note: 公開RSS、Microsoft標準コーポレートフィード、出所明示で集約可

  # ============================================================
  # Paper (1) — 論文フィード
