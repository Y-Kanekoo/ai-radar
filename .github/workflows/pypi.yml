name: Publish to PyPI

# トリガ:
#   - `v*.*.*` 形式の tag push (例: v0.1.0) → TestPyPI → PyPI を順次公開
#   - `v*.*.*-rc*` 形式の tag (例: v0.1.0-rc1) → TestPyPI のみ
#   - workflow_dispatch → 手動実行 (test_only オプションあり)
on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-*"
  workflow_dispatch:
    inputs:
      test_only:
        description: "TestPyPI のみ (本番 PyPI にはアップロードしない)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify existing uv tool cache before setup
        env:
          UV_INSTALLER_TOOL_CACHE: ${{ runner.tool_cache }}
        run: python3 scripts/verify_uv_tool_cache.py --tool-cache "$UV_INSTALLER_TOOL_CACHE" --allow-missing

      - name: Install uv
        id: uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          activate-environment: false
          checksum: "23bf5552d220e0842b65c862097b2ebaeba0064b74eda5e565e77fd25969d8c8"
          python-version: "3.11"
          prune-cache: true
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Verify installed uv tool cache before execution
        env:
          UV_INSTALLER_TOOL_CACHE: ${{ runner.tool_cache }}
          SELECTED_UV: ${{ steps.uv.outputs.uv-path }}
          SELECTED_UVX: ${{ steps.uv.outputs.uvx-path }}
        run: >-
          python3 scripts/verify_uv_tool_cache.py --tool-cache "$UV_INSTALLER_TOOL_CACHE"
          --check-selected --selected-uv "$SELECTED_UV" --selected-uvx "$SELECTED_UVX"

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Check dependency lock
        run: uv lock --check

      - name: Record tool versions
        run: |
          uv --version
          uv run --locked python --version

      - name: Build
        run: uv build

      - name: Verify wheel contents
        run: |
          uv run --locked --with twine -- twine check dist/*
          ls -la dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/ai-radar
    permissions:
      id-token: write  # OIDC for Trusted Publishing
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          # skip-existing: pre-release tag を複数回 push しても再アップロードでエラーにしない
          skip-existing: true

  publish-pypi:
    name: Publish to PyPI (production)
    needs: publish-testpypi
    # 本番への公開:
    #   - tag push で v*.*.* (rc 等のプレリリース無し) のときのみ
    #   - workflow_dispatch のときは test_only=false 指定時のみ
    if: >-
      (github.event_name == 'push' && !contains(github.ref_name, '-')) ||
      (github.event_name == 'workflow_dispatch' && inputs.test_only != true)
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/ai-radar
    permissions:
      id-token: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
