name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.12.19"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Pin Python for this run
        run: echo "${{ matrix.python-version }}" > .python-version

      - name: Sync dependencies
        run: uv sync --locked --all-extras --dev

      - name: Record tool versions
        run: |
          uv --version
          uv run --locked python --version

      - name: Lint (ruff check)
        run: uv run --locked ruff check .

      - name: Format check (ruff format --check)
        run: uv run --locked ruff format --check .

      - name: Test (pytest)
        run: uv run --locked pytest -v --cov=ai_radar --cov-report=term-missing

      - name: Coverage threshold (>=80%)
        run: uv run --locked coverage report --fail-under=80
