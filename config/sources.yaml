# ai-radar ソースリスト（Phase 5、26本、RSS/Atom 18 + scraper 8、全件有効）
#
# スキーマ:
#   slug:       一意ID (snake_case 推奨、DB の sources.slug に保存)
#   name:       表示名
#   feed_url:   RSS / Atom / JSON Feed URL
#   site_url:   サイトトップ
#   language:   ja | en
#   category:   release | paper | newsletter | tool | jp
#               (qa-radar 由来の tool|blog|community|paper|note は廃止)
#   tier:       既存配信優先度 (1〜5)。査読状態/品質保証とは独立。数値は維持。
#               Phase 2 でスコアリング式 (source_tier × time_decay × user_interest) に使用
#   provenance: 発見元の説明。記事に継承せず、スコアには使わない。
#     source_type: preprint_repository | research_aggregator 等 (既定 unknown)
#     publication_venue: 確認済み掲載先。不明は null (発見サイトとは別)
#     review_status: unknown | not_peer_reviewed | peer_reviewed (既定 unknown)
#     review_evidence_url: 査読の根拠URL。peer_reviewed は掲載先と根拠URLが必須
#     popularity_signal: none | community_upvotes (品質/査読の証拠ではない)
#   enabled:    クローラーが取り込むか
#   fetch_kind: rss (既定、Atomを含む) | scraper
#   fetch_policy:
#     min_interval_seconds:   再取得の最小間隔（DDoS抑止）
#     max_items_per_fetch:    1回の取得で読む上限
#   license_note:             利用規約上の集約可否についてのメモ
#
# 確認日: 2026-10-31。Phase 5 追加6本は curl で HTTP 200 + RSS/Atom パースを確認。
# 各配信ホストの robots.txt と公開利用規約を確認（詳細は各 license_note）。
# 既存20本のURL確認日は 2026-05-13 (WebFetch + curl、DOM 構造解析)。今回の再確認対象外。
# Sakana AI は Phase 0 検証時に見落としていた `feed.xml` (Atom) が利用可能なので RSS 経路.
# Anthropic / HF Papers / Cursor / ELYZA / AI2 / Kimi / Luma / BFL は fetch_kind: scraper
# (per-source HTML parser を `src/ai_radar/crawler/scrapers/{slug}.py` に実装).
# OpenAI は 403 ロックアウトのため Phase 1 で Wayback Machine 経由実装を予定.

