name: Deploy GitHub Pages

# Phase 7 以降は crawl.yml が cron で自動デプロイするため、
# pages.yml は手動デプロイ (workflow_dispatch) のみ. 緊急時の即時再生成用に残す.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify existing uv tool cache before setup
        env:
          UV_INSTALLER_TOOL_CACHE: ${{ runner.tool_cache }}
        run: python3 scripts/verify_uv_tool_cache.py --tool-cache "$UV_INSTALLER_TOOL_CACHE" --allow-missing

      - name: Install uv
        id: uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          activate-environment: false
          checksum: "23bf5552d220e0842b65c862097b2ebaeba0064b74eda5e565e77fd25969d8c8"
          python-version: "3.11"
          prune-cache: true
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Verify installed uv tool cache before execution
        env:
          UV_INSTALLER_TOOL_CACHE: ${{ runner.tool_cache }}
          SELECTED_UV: ${{ steps.uv.outputs.uv-path }}
          SELECTED_UVX: ${{ steps.uv.outputs.uvx-path }}
        run: >-
          python3 scripts/verify_uv_tool_cache.py --tool-cache "$UV_INSTALLER_TOOL_CACHE"
          --check-selected --selected-uv "$SELECTED_UV" --selected-uvx "$SELECTED_UVX"

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Sync dependencies
        run: uv sync --locked --all-extras --dev

      - name: Record tool versions
        run: |
          uv --version
          uv run --locked python --version

      - name: Crawl sources (build fresh DB)
        run: uv run --locked python scripts/run_crawl.py --concurrency 5

      - name: Build pages
        run: uv run --locked python scripts/build_pages.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs/_build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
