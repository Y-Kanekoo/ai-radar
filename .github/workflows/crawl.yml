name: Crawl, build, and deploy

# cron: 09:00 / 15:00 / 21:00 JST (UTC = 00:00 / 06:00 / 12:00)
on:
  schedule:
    - cron: "0 0,6,12 * * *"
  workflow_dispatch:
    inputs:
      skip_discord:
        description: "Discord 通知をスキップ"
        type: boolean
        default: false
      skip_deploy:
        description: "Pages デプロイをスキップ"
        type: boolean
        default: false

permissions:
  contents: write   # release create / delete
  pages: write
  id-token: write

concurrency:
  group: "crawl"
  cancel-in-progress: false

jobs:
  crawl-and-build:
    name: Crawl + tag + build + notify + publish
    runs-on: ubuntu-latest
    outputs:
      notify_outcome: ${{ steps.notify.outcome }}
      added: ${{ steps.crawl.outputs.added }}
      pages_artifact: ${{ steps.pages_uploaded.outputs.uploaded }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify existing uv tool cache before setup
        env:
          UV_INSTALLER_TOOL_CACHE: ${{ runner.tool_cache }}
        run: python3 scripts/verify_uv_tool_cache.py --tool-cache "$UV_INSTALLER_TOOL_CACHE" --allow-missing

      - name: Install uv
        id: uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          activate-environment: false
          checksum: "23bf5552d220e0842b65c862097b2ebaeba0064b74eda5e565e77fd25969d8c8"
          python-version: "3.11"
          prune-cache: true
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Verify installed uv tool cache before execution
        env:
          UV_INSTALLER_TOOL_CACHE: ${{ runner.tool_cache }}
          SELECTED_UV: ${{ steps.uv.outputs.uv-path }}
          SELECTED_UVX: ${{ steps.uv.outputs.uvx-path }}
        run: >-
          python3 scripts/verify_uv_tool_cache.py --tool-cache "$UV_INSTALLER_TOOL_CACHE"
          --check-selected --selected-uv "$SELECTED_UV" --selected-uvx "$SELECTED_UVX"

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Sync dependencies
        run: uv sync --locked --all-extras

      - name: Record tool versions
        run: |
          uv --version
          uv run --locked python --version

      - name: Restore previous DB from Releases (if exists)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          uv run --locked python scripts/publish_release.py \
            --mode download \
            --repo "${{ github.repository }}" \
            --download-to data/articles.db || echo "No previous release; starting fresh"

      - name: Crawl + tag (自動でタグ付け)
        id: crawl
        run: |
          uv run --locked python scripts/run_crawl.py --concurrency 5 2>&1 | tee /tmp/crawl.log
          ADDED=$(grep -oE "追加=[0-9]+" /tmp/crawl.log | tail -1 | cut -d= -f2 || echo 0)
          echo "added=${ADDED:-0}" >> "$GITHUB_OUTPUT"
          echo "::notice title=Crawl complete::Added ${ADDED:-0} articles"

      - name: Notify Discord (idempotent, skips if URL unset)
        id: notify
        continue-on-error: true
        if: ${{ inputs.skip_discord != true }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          AI_RADAR_DISCORD_WEBHOOK_RELEASE: ${{ secrets.AI_RADAR_DISCORD_WEBHOOK_RELEASE }}
          AI_RADAR_DISCORD_WEBHOOK_PAPER: ${{ secrets.AI_RADAR_DISCORD_WEBHOOK_PAPER }}
          AI_RADAR_DISCORD_WEBHOOK_NEWSLETTER: ${{ secrets.AI_RADAR_DISCORD_WEBHOOK_NEWSLETTER }}
          AI_RADAR_DISCORD_WEBHOOK_TOOL: ${{ secrets.AI_RADAR_DISCORD_WEBHOOK_TOOL }}
          AI_RADAR_DISCORD_WEBHOOK_JP: ${{ secrets.AI_RADAR_DISCORD_WEBHOOK_JP }}
          AI_RADAR_DISCORD_WEBHOOK_BENCHMARK: ${{ secrets.AI_RADAR_DISCORD_WEBHOOK_BENCHMARK }}
          AI_RADAR_DISCORD_WEBHOOK_TREND: ${{ secrets.AI_RADAR_DISCORD_WEBHOOK_TREND }}
          AI_RADAR_DISCORD_WEBHOOK_PODCAST: ${{ secrets.AI_RADAR_DISCORD_WEBHOOK_PODCAST }}
        run: |
          uv run --locked python scripts/notify_discord.py --limit 20

      - name: Build pages
        run: uv run --locked python scripts/build_pages.py

      - name: Publish DB snapshot to GH Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          uv run --locked python scripts/publish_release.py \
            --mode full \
            --repo "${{ github.repository }}" \
            --retention-days 7

      - name: Configure Pages
        if: ${{ inputs.skip_deploy != true }}
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        id: pages_artifact
        if: ${{ inputs.skip_deploy != true }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs/_build

      - name: Mark artifact uploaded
        id: pages_uploaded
        if: ${{ inputs.skip_deploy != true }}
        run: echo "uploaded=true" >> "$GITHUB_OUTPUT"

  notification-result:
    name: Preserve Discord notification failure
    needs: crawl-and-build
    if: ${{ always() && needs.crawl-and-build.outputs.notify_outcome == 'failure' }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Report notification failure
        run: |
          echo "::error::Discord notification failed; inspect notification summary. Publication runs independently."
          exit 1

  deploy:
    name: Deploy to GitHub Pages
    needs: crawl-and-build
    if: ${{ inputs.skip_deploy != true }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
